# Real visitor IPs behind Cloudflare (tuckerpaymentprocessing.com).
# Install:  sudo a2enmod remoteip
#           sudo cp deploy/apache-cloudflare.conf /etc/apache2/conf-available/tucker-cloudflare.conf
#           sudo a2enconf tucker-cloudflare && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# With Cloudflare in front, every request reaches us from a Cloudflare address. Cloudflare puts the real visitor
# IP in the CF-Connecting-IP header. We believe that header ONLY when the request really came from one of
# Cloudflare's published ranges (below); from anywhere else it's ignored, so nobody can fake their IP to dodge
# the per-network limits (chat fair share, verification lockout, one Cipher run per day).
# Apache then passes the real IP to the app in X-Forwarded-For, which the app trusts only from 127.0.0.1.
#
# Cloudflare's IPv4 ranges, from https://www.cloudflare.com/ips/ (checked 2026-11-24). The Google Cloud
# firewall allows web traffic only from these same ranges (see deploy/gcp-firewall.md).
RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
RemoteIPTrustedProxy 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
RemoteIPTrustedProxy 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22

# Visit log: the standard "combined" format plus Cloudflare's rough visitor location (country|region|city), used
# by the owner's nightly report (app/report.py). With remoteip above, %h is the real visitor IP.
# Logs are kept for at most two days (deploy/logrotate-apache2).
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" cf=\"%{CF-IPCountry}i|%{CF-Region}i|%{CF-IPCity}i\"" combined
