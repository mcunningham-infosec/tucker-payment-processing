# Apache site for the STAGING server only (staging.tuckerpaymentprocessing.com). Never installed on production.
# Cloudflare Access (Google login) sits in front, so only the owner reaches this server through Cloudflare;
# the Google Cloud firewall still admits web traffic only from Cloudflare, exactly like production.
# certbot adds the HTTPS (port 443) copy of this site and the HTTP-to-HTTPS redirect.
# Tucker Payment Processing by Michael Cunningham. (c) 2026. Built with AI-assisted development.
<VirtualHost *:80>
    ServerName staging.tuckerpaymentprocessing.com
    DocumentRoot /var/www/html
    Include /etc/apache2/conf-available/tucker-api.inc

    # Keep search engines out, on every response.
    Header always set X-Robots-Tag "noindex, nofollow"
    Alias /robots.txt /etc/apache2/tucker-staging-robots.txt
    <Location "/robots.txt">
        Require all granted
    </Location>

    # A STAGING banner on every page and in every tab title, added here so the site files stay identical to
    # production. The banner's look comes from .staging-banner in assets/site.css (no inline styles: CSP).
    AddOutputFilterByType SUBSTITUTE text/html
    Substitute "s|<title>|<title>[STAGING] |"
    Substitute "s|(<body[^>]*>)|$1<div class=\"staging-banner\">STAGING: test copy of Tucker Payment Processing, not the live site</div>|"
</VirtualHost>
