# /etc/ssh/sshd_config.d/50-tucker-hardening.conf - SSH hardening for Tucker's servers.
# Installed by deploy/update.sh. SSH is reachable only through Google's Identity-Aware Proxy, never from the
# internet, but the server should still offer only modern cryptography.
#
# Why: a Qualys external scan (Nov 27, 2026) flagged "SHA1 deprecated setting for SSH" (QID 38909). Ubuntu's
# defaults still offer hmac-sha1 and the 64-bit umac MACs for compatibility with old clients. Tucker's only
# SSH client is gcloud over IAP, which uses the SHA-2 options below, so nothing loses access.
# Tucker Payment Processing by Michael Cunningham. (c) 2026. Built with AI-assisted development.

# Message authentication: SHA-2 and 128-bit umac only (no SHA-1, no 64-bit tags). Encrypt-then-MAC first.
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256,hmac-sha2-512,umac-128@openssh.com

# Key exchange: Ubuntu's modern defaults, minus the 2048-bit group14 Diffie-Hellman fallback.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# Logins: keys only (already Ubuntu's setting on Google Cloud images; stated here so it can't drift).
PasswordAuthentication no
