# Apache: send /api/ requests to Tucker's app on 127.0.0.1:8000. Everything else is static files.
# Install: sudo cp deploy/tucker-api.conf /etc/apache2/conf-available/ && sudo a2enconf tucker-api
# Needs: sudo a2enmod proxy proxy_http

ProxyRequests Off
ProxyPass        /api/ http://127.0.0.1:8000/api/ timeout=30
ProxyPassReverse /api/ http://127.0.0.1:8000/api/

<Location /api/>
    # Chat messages are tiny (500 characters max), so refuse anything big at the door.
    LimitRequestBody 8192
    # API answers are personal to one chat session: never cache them.
    Header always set Cache-Control "no-store"
</Location>
