# Apache hardening for tuckerpaymentprocessing.com (one file, kept in version control).
# Install:  sudo a2dismod -f status            (server-status page: unused, and reachable from the server itself)
#           sudo cp deploy/apache-hardening.conf /etc/apache2/conf-available/tucker-hardening.conf
#           sudo a2disconf hardening security-headers   (the older, server-only copies of the same rules)
#           sudo a2enconf tucker-hardening && sudo a2enmod headers && sudo apache2ctl configtest && sudo systemctl reload apache2
# Every rule below is tested live by Cipher's attack run (OWASP Top 10:2025, A02 Security Misconfiguration).
# Tucker Payment Processing by Michael Cunningham. (c) 2026. Built with AI-assisted development.

# --- Don't advertise what we run (version banners help attackers pick exploits) ---
ServerTokens Prod
ServerSignature Off

# --- Only the HTTP methods the site uses. TRACE can leak headers; PUT/DELETE etc. have no business here ---
TraceEnable Off
<Location "/">
    <LimitExcept GET HEAD POST>
        Require all denied
    </LimitExcept>
</Location>

# --- Request size: nothing on this site legitimately sends more than a few KB.
#     (Found by Cipher: the /api/-only limit wasn't applied to proxied requests; this server-wide one is,
#      and the app enforces 16 KB itself as a second layer.) ---
LimitRequestBody 16384

# --- No directory listings (found by Cipher: /assets/ used to list every file) and no .htaccess surprises ---
<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# --- Hidden files (.git, .env, editor backups) never served, even if one is copied there by mistake.
#     /.well-known/ stays reachable for certificate renewals. ---
RedirectMatch 404 "/\.(?!well-known/)"
<FilesMatch "(~|\.bak|\.swp|\.orig|\.old)$">
    Require all denied
</FilesMatch>

# --- Browser security headers (sent on every response, including errors) ---
Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# --- Caching (Cloudflare and browsers): pages, scripts and styles are always revalidated, so a deploy shows up at
#     once; images can be cached for a day. API answers are never cached anywhere (they can be per-visitor).
#     Cloudflare's Browser Cache TTL can still tell browsers to keep .js/.css for hours, so every page links them
#     with a version (assets/x.js?v=...): change the version on deploy and browsers fetch the new file. ---
<FilesMatch "\.(html|js|css)$">
    Header set Cache-Control "no-cache"
</FilesMatch>
<FilesMatch "\.(png|svg|jpg|webp|ico|mp3)$">
    Header set Cache-Control "public, max-age=86400"
</FilesMatch>
<Location "/api/">
    Header always set Cache-Control "no-store"
</Location>

# --- The one exception to "our own scripts only": Cipher's Lair loads Cloudflare Turnstile (the "are you human?"
#     check on the attack button) from Cloudflare. Allowed on that page only, and only from that one host. ---
<Location "/cipher.html">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
</Location>
